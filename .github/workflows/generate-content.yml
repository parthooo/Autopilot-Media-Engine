name: Generate Content

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Content variant"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - youtube-only
          - articles-only

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generate content
        run: |
          VARIANT="${{ github.event.inputs.variant || 'all' }}"
          FLAGS=""
          if [ "$VARIANT" = "youtube-only" ]; then FLAGS="--youtube-only"; fi
          if [ "$VARIANT" = "articles-only" ]; then FLAGS="--articles-only"; fi
          npm run worker -- generate-content $FLAGS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
